services: 
  - type: web 
    name: timetable-backend 
    env: python
    
    # Setting to Python 3.11.8, a widely supported LTS version. 
    # This change must be combined with updating 'lxml' in requirements.txt.
    pythonVersion: 3.11.8
    
    # We still need these packages for lxml to compile if a wheel isn't found.
    preBuildCommand: "pip install --upgrade pip && apt-get update && apt-get install -y libxml2-dev libxslt-dev build-essential" 
    
    buildCommand: "pip install -r requirements.txt" 
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT" 
    
    envVars: 
      - key: PORT 
        value: 8000 
      # Keeping consistent with the operational version.
      - key: PYTHON_VERSION 
        value: 3.11.8
